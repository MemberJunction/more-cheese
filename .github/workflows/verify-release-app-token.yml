# Does the release App credential actually work in THIS repository?
#
# WHY THIS EXISTS
# ---------------
# This repo has never published — no `v*` tag exists — and the release path in
# `release-prep.yml` depends on a credential nobody has minted here before: a GitHub App, not
# `GITHUB_TOKEN`. Two independent facts make `GITHUB_TOKEN` unusable for that job. First, `next`
# carries the `next-protect` ruleset (id 18797049, targets `~DEFAULT_BRANCH`, requires a pull
# request, lists no bypass actors), so a workflow cutting a release branch and opening a PR into
# `main` needs a token whose PR triggers `changes.yml` at all — GitHub does not start workflow runs
# from events authored by `GITHUB_TOKEN`, so a PR opened with it would get no gate signal before a
# human merges it. Second, `main` carries no ruleset of its own today, which is exactly why
# `scripts/check-release-pushes.mjs` refuses a direct push to either branch regardless of what
# GitHub currently enforces — the release path is designed not to depend on that staying true.
#
# MJ core and bizapps-forms hit the equivalent problem before this repo did and both fixed it the
# same way: a GitHub App, minted from `vars.APP_CLIENT_ID` (org variable) and
# `secrets.APP_PRIVATE_KEY` (org secret) — both already visible here, so the App model costs this
# repo no new infrastructure.
#
# WHAT THE APP IS FOR, AND WHAT IT IS EMPHATICALLY NOT FOR
# --------------------------------------------------------
# Not a bypass. `next-protect` keeps `bypass_actors: []`, and this workflow deliberately does NOT
# ask whether the App could bypass it. The App does exactly two things in this repo's release path,
# neither of them privileged: it pushes `release/*`, which no ruleset covers (`next-protect` targets
# only the default branch, and `release/*` is not it), and it opens a pull request into `main`. That
# branch and that PR then go through `changes.yml` like any other.
#
# The single reason it cannot just be `GITHUB_TOKEN`: GitHub does not start workflow runs from
# events authored with it, so a PR opened that way would show no check runs at all, and a reviewer
# would be merging blind. That is the entire justification for using an App here.
#
# WHAT GREEN LOOKS LIKE
# ---------------------
# An org secret being readable and an App installation covering `more-cheese` are different facts,
# and only the second one decides whether the release automation works. Nothing outside Actions can
# read either. The mint below is scoped to this repository alone, so it FAILS unless the
# installation includes this repo — which is the question. Green means: the private key is valid,
# the App is the one we think it is, its two grants are intact, and a token minted for this repo can
# read this repo.
#
# Run it before trusting release-prep.yml. A red run here means the release path is broken, and
# finding that out now costs a minute; finding it out mid-dispatch costs a half-finished release
# branch nobody can push.
#
# READ-ONLY. It writes nothing, pushes nothing, opens nothing and edits no ruleset — run it whenever.
name: Verify the release App token

on:
  workflow_dispatch:

# The job's own GITHUB_TOKEN needs nothing: every call below deliberately uses the minted App token,
# because proving the App works is the whole point. A GITHUB_TOKEN that could answer these questions
# would make the run green while telling you nothing about the credential the release uses.
permissions: {}

jobs:
  verify:
    name: Verify the release App credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Asserted, not printed. If `APP_PRIVATE_KEY` belonged to some OTHER app installed on this
      # org, the mint would still succeed and every check below would still pass — against the wrong
      # app. `blue-cypress-ci-bot` is the app the family's release automation drives with this same
      # pair of org-level values (bizapps-forms, MJ core); if the org ever moves the release
      # automation to a different app, this is the line that has to move with it.
      EXPECTED_APP_SLUG: blue-cypress-ci-bot
    steps:
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts a client ID as well as a numeric app id, which is what the org variable
          # holds. Read from `vars` rather than hardcoded, so this tests the SAME pair of values
          # release-prep.yml uses — a probe against different inputs proves nothing.
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # No `owner:`. Default scoping mints a token for THIS repository only, which is what makes
          # this a real test rather than a test of the org: if the installation does not cover
          # more-cheese, this step fails and nothing below runs.
          #
          # Naming the permissions is what keeps the workflow read-only without losing coverage.
          # GitHub refuses to mint a token carrying permissions the installation does not hold, so a
          # trimmed grant fails HERE with a clear error, instead of surfacing later as a push or a
          # `gh pr create` that dies looking exactly like the branch-protection problem all of this
          # is about. These are the two release-prep.yml needs and no more: contents to push
          # `release/*`, pull-requests to open the release PR.
          permission-contents: write
          permission-pull-requests: write

      - name: The key belongs to the app we think it does
        env:
          GOT_SLUG: ${{ steps.token.outputs.app-slug }}
          GOT_INSTALLATION: ${{ steps.token.outputs.installation-id }}
        run: |
          set -euo pipefail
          echo "app-slug        = $GOT_SLUG"
          echo "installation-id = $GOT_INSTALLATION"
          if [ "$GOT_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "::error::APP_PRIVATE_KEY belongs to '$GOT_SLUG', not '$EXPECTED_APP_SLUG'."
            echo "::error::Do not wire the release to it until you know what that app is and what it can reach."
            exit 1
          fi
          # The installation id is reported, not asserted. There is no independently known value to
          # compare it against for this repo, and asserting one would fail the day the org reinstalls
          # the app — which changes the id while changing nothing that matters. The fact it would
          # prove is already proven above: an installation that did not cover more-cheese could not
          # have minted this token at all.
          echo "::notice::Identity confirmed: $GOT_SLUG (installation $GOT_INSTALLATION)"

      - name: The token can actually reach this repository
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # `.full_name`, not `.permissions`. That block is computed for an authenticated USER, so an
          # installation token reads it all-false no matter what it actually holds. What a read
          # proves here is that the scoped token addresses THIS repository and the API accepts it.
          FULL_NAME=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name')
          if [ "$FULL_NAME" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::the token read '$FULL_NAME' when asked about '$GITHUB_REPOSITORY'."
            exit 1
          fi
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          echo "::notice::Read $FULL_NAME (default branch $DEFAULT_BRANCH) as ${{ steps.token.outputs.app-slug }}."
          {
            echo "### Release App credential"
            echo
            echo '| field | value |'
            echo '|---|---|'
            echo "| app | \`${{ steps.token.outputs.app-slug }}\` |"
            echo "| installation | \`${{ steps.token.outputs.installation-id }}\` |"
            echo "| scoped to | \`$FULL_NAME\` |"
            echo "| grants requested | \`contents: write\`, \`pull-requests: write\` |"
            echo
            echo 'Green: the key is valid, the installation covers this repository, and both grants are intact.'
            echo 'The App is **not** a ruleset bypass actor and must never become one — it pushes only'
            echo '`release/*`, which no ruleset covers, and opens a pull request that runs `changes.yml` like'
            echo 'anyone else'"'"'s.'
          } >> "$GITHUB_STEP_SUMMARY"
