name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    branches: [next, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: npm ci

      - name: Nothing may push to main or next
        run: npm run lint:release-pushes

      # A gate whose own test is not wired into CI is a gate nobody is checking — and this one
      # spent its whole life unable to detect the mis-casing it exists for, because it asked git
      # for the case variant through a pathspec glob, which is byte-exact whatever core.ignorecase
      # says. It reported "No case-sensitivity issues found" over every lockfile it was ever given.
      #
      # The gate itself runs in publish.yml, where a mis-cased lockfile breaks `npm ci` on Linux;
      # its test runs HERE, on every pull request, so the repair is checked by the workflow that
      # blocks a merge rather than only by the one that cuts a release. It is a .sh harness rather
      # than an entry in `npm run test:gates`, which is `node --test` over the .mjs specs — the
      # sibling repos (bizapps-forms, bizapps-common) run this same harness as its own step, and
      # matching them keeps the port in both directions legible. It needs only git and jq, so its
      # placement after `npm ci` is for grouping with the other gate steps, not a dependency.
      - name: CI guard script tests
        run: ./.github/scripts/__tests__/validate-package-lock-case.test.sh

      - name: Every publishable package declares files and publishConfig
        run: ./.github/scripts/validate-package-files.sh

      # `mj-app.json`'s version and mjVersionRange are DERIVED from packages/Entities
      # (scripts/sync-app-version.mjs); `--check` is that derivation asserted rather than written.
      # It also runs inside `release-prep.mjs --apply` and again in `publish.yml`, but both of those
      # are past the human merge gate — a hand-edited manifest that reaches them turns into a red
      # publish run over an already-merged promotion. Asking here makes the answer arrive on the pull
      # request that introduced the drift, which is the only place it is cheap.
      - name: mj-app.json is still derived from the packages
        run: node scripts/sync-app-version.mjs --check

      - name: Build all packages
        run: npm run build:packages
