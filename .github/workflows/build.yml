name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
  pull_request:
    branches: [next, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: npm ci

      - name: Nothing may push to main or next
        run: npm run lint:release-pushes

      - name: Every publishable package declares files and publishConfig
        run: ./.github/scripts/validate-package-files.sh

      # `mj-app.json`'s version and mjVersionRange are DERIVED from packages/Entities
      # (scripts/sync-app-version.mjs); `--check` is that derivation asserted rather than written.
      # It also runs inside `release-prep.mjs --apply` and again in `publish.yml`, but both of those
      # are past the human merge gate — a hand-edited manifest that reaches them turns into a red
      # publish run over an already-merged promotion. Asking here makes the answer arrive on the pull
      # request that introduced the drift, which is the only place it is cheap.
      - name: mj-app.json is still derived from the packages
        run: node scripts/sync-app-version.mjs --check

      - name: Build all packages
        run: npm run build:packages
